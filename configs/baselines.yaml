# Phase 1: classic baselines + the original GA+WoC method, evaluated walk-forward.
experiment: baselines
seed: 42

data:
  dir: data
  price_start: "2005-01-01"
  price_end: null          # null = up to today
  benchmark: SPY

backtest:
  start: "2010-01-01"
  end: null
  rebalance: M             # monthly
  lookback: 252            # one year of daily returns per decision
  cost_bps: 10             # 0.10% of traded value
  universe_size: 100       # most liquid point-in-time S&P 500 members
  universe_refresh: Y      # re-selected every January
  liquidity_window: 63

# Development = where future AI models will be trained/tuned. Test = never touched for tuning.
periods:
  full:        ["2010-01-01", null]
  development: ["2010-01-01", "2019-12-31"]
  test:        ["2020-01-01", null]
  covid_crash: ["2020-02-19", "2020-03-23"]
  bear_2022:   ["2022-01-03", "2022-10-12"]

strategies:
  - name: EqualWeight
    type: equal_weight
  - name: InverseVol
    type: inverse_volatility
  - name: MinVariance
    type: min_variance
    params: {max_weight: 0.10}
  - name: MeanVariance
    type: mean_variance
    params: {risk_aversion: 5.0, mean_shrinkage: 0.5, max_weight: 0.10}
  - name: RiskParity
    type: risk_parity
  - name: GA
    type: genetic_woc
    params: {woc: false, max_weight: 0.10}
  - name: GA+WoC
    type: genetic_woc
    params: {woc: true, crowd_size: 10, max_weight: 0.10}
