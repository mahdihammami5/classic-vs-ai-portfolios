[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfopt"
version = "0.1.0"
description = "Classic vs AI portfolio optimization on the S&P 500: a fair, cost-aware, walk-forward benchmark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "cvxpy>=1.4",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
# GPU users: install torch from https://pytorch.org first to get the CUDA build.
deep = ["torch>=2.2"]
foundation = ["torch>=2.2", "chronos-forecasting>=2.3", "peft>=0.13"]

[project.scripts]
pfopt = "pfopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
